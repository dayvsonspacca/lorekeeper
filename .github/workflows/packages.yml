name: Packages

on:
  push:
    branches: [main]
    paths: &paths
      - 'packages/**'
      - 'config/phpunit.xml.dist'
      - 'composer.json'
      - 'Justfile'
      - '.github/workflows/packages.yml'
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_sqlite, pcntl, curl, xmlreader
          coverage: ${{ matrix.php == '8.5' && 'pcov' || 'none' }}
      - uses: extractions/setup-just@v4
      - uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json', 'packages/*/composer.json') }}
      - run: just install
      - if: matrix.php != '8.5'
        run: just test --no-progress
      - if: matrix.php == '8.5'
        run: just coverage --no-progress
      - if: matrix.php == '8.5'
        uses: actions/upload-pages-artifact@v5
        with:
          path: var/coverage

  coverage:
    name: Publish coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
