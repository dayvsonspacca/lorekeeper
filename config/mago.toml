php-version = "8.4.0"

[source]
workspace = "."
paths = ["packages"]
includes = ["vendor"]
excludes = ["*packages/**/vendor/*"]

[formatter]
preset = "default"

[linter]
integrations = ["phpunit", "psl"]

[linter.rules]
psl-string-functions = { enabled = false }
psl-array-functions = { enabled = false }
psl-randomness-functions = { enabled = false }
psl-regex-functions = { enabled = false }
psl-datetime = { enabled = false }
psl-math-functions = { enabled = false }

[analyzer]
plugins = ["psl"]
excludes = ["*/packages/**/tests/*"]

# Layer boundaries. Core is pure: no I/O, no protocol knowledge, depends on nothing
# but PSL types.
[guard]
mode = "perimeter"
excludes = ["*/packages/**/tests/*", "*/packages/**/scripts/*"]

[guard.perimeter.layers]
ext = ["@native", "@global", "Psl\\**"]

[[guard.perimeter.rules]]
namespace = "Lorekeeper\\Core"
permit = ["@layer:ext", "Lorekeeper\\Core\\**"]

[[guard.perimeter.rules]]
namespace = "Lorekeeper\\Protocol"
permit = ["@layer:ext", "Lorekeeper\\Protocol\\**", "Lorekeeper\\Core\\**"]

[[guard.perimeter.rules]]
namespace = "Lorekeeper\\Miner"
permit = [
    "@layer:ext",
    "Lorekeeper\\Miner\\**",
    "Lorekeeper\\Protocol\\**",
    "Lorekeeper\\Persistence\\**",
    "Lorekeeper\\Core\\**",
]

[[guard.perimeter.rules]]
namespace = "Lorekeeper\\Persistence"
permit = ["@layer:ext", "Lorekeeper\\Persistence\\**", "Lorekeeper\\Core\\**"]
