php-version = "8.4.0"

[source]
workspace = "."
paths = ["packages", "apps/desktop/app", "apps/desktop/bootstrap", "apps/desktop/database", "apps/desktop/tests", "apps/recorder/src", "apps/recorder/tests"]
includes = ["vendor", "apps/desktop/vendor"]
excludes = ["*packages/**/vendor/*", "*apps/desktop/bootstrap/cache/*"]

[formatter]
preset = "default"

[linter]
integrations = ["laravel", "phpunit", "psl"]

[linter.rules]
psl-string-functions = { enabled = false }
psl-array-functions = { enabled = false }
psl-randomness-functions = { enabled = false }
psl-regex-functions = { enabled = false }
psl-datetime = { enabled = false }
psl-math-functions = { enabled = false }
psl-output = { enabled = false }
too-many-enum-cases = { enabled = false }

[analyzer]
plugins = ["psl"]
excludes = ["*/packages/**/tests/*", "*/apps/desktop/*", "*/apps/recorder/tests/*"]

# Layer boundaries. Core is pure: no I/O, no protocol knowledge, depends on nothing
# but PSL types.
[guard]
mode = "perimeter"
excludes = ["*/packages/**/tests/*", "*/apps/desktop/bootstrap/*", "*/apps/desktop/database/*", "*/apps/desktop/tests/*", "*/apps/recorder/tests/*"]

[guard.perimeter.layers]
ext = ["@native", "@global", "Psl\\**"]

[[guard.perimeter.rules]]
namespace = "Lorekeeper\\Core"
permit = ["@layer:ext", "Lorekeeper\\Core\\**"]

[[guard.perimeter.rules]]
namespace = "Lorekeeper\\Server"
permit = ["@layer:ext", "Lorekeeper\\Server\\**", "Lorekeeper\\Core\\**"]

[[guard.perimeter.rules]]
namespace = "Lorekeeper\\Client"
permit = ["@layer:ext", "Lorekeeper\\Client\\**", "Lorekeeper\\Server\\**", "Lorekeeper\\Core\\**"]

[[guard.perimeter.rules]]
namespace = "Lorekeeper\\Bot"
permit = ["@layer:ext", "Lorekeeper\\Bot\\**", "Lorekeeper\\Client\\**", "Lorekeeper\\Server\\**", "Lorekeeper\\Core\\**"]

[[guard.perimeter.rules]]
namespace = "Lorekeeper\\Apps\\Desktop"
permit = ["@layer:ext", "Lorekeeper\\**", "Illuminate\\**", "Filament\\**", "Livewire\\**", "Symfony\\**", "Native\\**", "BladeUI\\Icons\\**"]

[[guard.perimeter.rules]]
namespace = "Lorekeeper\\Apps\\Recorder"
permit = ["@layer:ext", "Lorekeeper\\**", "Revolt\\**"]
